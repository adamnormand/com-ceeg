# One-time import of the site's images from the old WordPress site (ceegim.com).
# Runs on push when the manifest changes, or manually from the Actions tab.
# Downloads every URL listed in assets/img/manifest.tsv that is not already in
# the repo, then commits the files. Safe to re-run; delete this workflow once
# the WordPress site is retired.
name: Fetch images from WordPress
on:
  push:
    branches: [main]
    paths: [assets/img/manifest.tsv]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download missing images
        run: |
          set -u
          ok=0; skip=0; fail=0
          while IFS=$'\t' read -r url path; do
            [ -z "$url" ] && continue
            if [ -s "$path" ]; then skip=$((skip+1)); continue; fi
            mkdir -p "$(dirname "$path")"
            if curl -fsSL --retry 3 --retry-delay 2 -A "Mozilla/5.0 (CEEG static migration)" -o "$path" "$url"; then
              ok=$((ok+1))
            else
              echo "::warning::failed $url"; rm -f "$path"; fail=$((fail+1))
            fi
            sleep 0.3
          done < assets/img/manifest.tsv
          echo "downloaded=$ok skipped=$skip failed=$fail"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Import images from ceegim.com"
          git push
